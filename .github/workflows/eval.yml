name: eval-model
# Runs the 40 emails through the model agent and scores them against the golden labels.
# Manual (Actions > eval-model > Run workflow) or by pushing a branch named eval/<anything>.
# Uses the LLM_API_KEY repository secret; costs a few cents per run on DeepInfra.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id (comma separated for a fallback chain); empty for the default
        required: false
  push:
    branches: ['eval/**']
permissions:
  contents: write # only to save results on the eval-results branch
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run 40 emails through the model agent
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/
      - name: Save the results on the eval-results branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp eval/* /tmp/out/ 2>/dev/null || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin eval-results; then git checkout -q -B eval-results FETCH_HEAD; else git checkout -q --orphan eval-results && git rm -rq --cached . && git clean -fdq; fi
          dir="runs/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          mkdir -p "$dir" && cp /tmp/out/* "$dir/"
          git add runs && git commit -qm "Eval ${GITHUB_RUN_ID} on ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          for i in 1 2 3; do git push -q origin HEAD:eval-results && break; git pull -q --rebase origin eval-results; done
